name: build

on: [push]

env:
  CATCH2_VERSION: v3.7.1
  WASM_GMP_VERSION: 6.3.0
  WASM_MPFR_VERSION: 4.2.2

jobs:
  build-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: ~/.apt-cache
          key: apt-${{ runner.os }}-mpfr
          restore-keys: apt-${{ runner.os }}-
      - name: Cache CMake dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: cmake-deps-catch2-${{ env.CATCH2_VERSION }}-${{ runner.os }}
      - name: Install MPFR
        run: |
          mkdir -p ~/.apt-cache/partial
          sudo apt-get update
          sudo apt-get -o dir::cache::archives="$HOME/.apt-cache" install -y --no-install-recommends libmpfr6 libmpfr-dev
      - name: Build
        uses: threeal/cmake-action@v2.1.0
      - name: Test
        uses: threeal/ctest-action@v1.1.0
        with:
          verbose: true

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Cache Homebrew downloads
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: brew-${{ runner.os }}-mpfr
          restore-keys: brew-${{ runner.os }}-
      - name: Cache CMake dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: cmake-deps-catch2-${{ env.CATCH2_VERSION }}-${{ runner.os }}
      - name: Install MPFR
        run: brew install mpfr
      - name: Export homebrew paths
        uses: spezifisch/export-homebrew-build-paths@v1.0.0
      - name: Build
        uses: threeal/cmake-action@v2.1.0
      - name: Test
        uses: threeal/ctest-action@v1.1.0
        with:
          verbose: true

  build-windows-mingw:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Cache CMake dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: cmake-deps-catch2-${{ env.CATCH2_VERSION }}-${{ runner.os }}
      - name: Install MPFR
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-mpfr mingw-w64-x86_64-cmake mingw-w64-x86_64-make mingw-w64-x86_64-gcc
      - name: Set MPFR root
        run: |
          echo "MPFR_ROOT=C:\msys64\mingw64" >> $env:GITHUB_ENV
      - name: Add MSYS2 MinGW to PATH
        run: |
          echo "C:\msys64\mingw64\bin" >> $GITHUB_PATH
      - name: Build
        shell: msys2 {0}
        run: |
          cmake -B build -S . -G "MinGW Makefiles"
          cmake --build build
      - name: Test
        shell: msys2 {0}
        run: |
          ctest --test-dir 'build' --output-on-failure --no-tests=error --verbose

  build-windows-msvc:
    runs-on: windows-latest
    env:
      VCPKG_ROOT: C:\vcpkg
      VCPKG_DEFAULT_TRIPLET: x64-windows-static
      VCPKG_BUILD_TYPE: release
      VCPKG_BINARY_SOURCES: clear;x-gha,readwrite
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Cache vcpkg tool
        uses: actions/cache@v4
        id: vcpkg-tool-cache
        with:
          path: C:\vcpkg
          key: vcpkg-tool-${{ runner.os }}
          restore-keys: vcpkg-tool-${{ runner.os }}
      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: vcpkg_installed
          key: vcpkg-${{ hashFiles('vcpkg.json') }}-${{ env.VCPKG_DEFAULT_TRIPLET }}-${{ env.VCPKG_BUILD_TYPE }}
      - name: Cache CMake dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: cmake-deps-catch2-${{ env.CATCH2_VERSION }}-${{ runner.os }}
      - name: Bootstrap vcpkg
        if: steps.vcpkg-tool-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git C:\vcpkg
          C:\vcpkg\bootstrap-vcpkg.bat
      - name: Build
        run: |
          cmake -B build -S . `
            -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake `
            -DVCPKG_TARGET_TRIPLET=${{ env.VCPKG_DEFAULT_TRIPLET }}
          cmake --build build --config Release
      - name: Test
        run: |
          ctest --test-dir build -C Release --output-on-failure --no-tests=error --verbose

  build-wasm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Cache Emscripten SDK
        uses: actions/cache@v4
        id: emsdk-cache
        with:
          path: /opt/emsdk
          key: emsdk-${{ runner.os }}-latest
          restore-keys: emsdk-${{ runner.os }}-
      - name: Cache WebAssembly dependencies
        uses: actions/cache@v4
        with:
          path: wasm-deps
          key: wasm-deps-gmp-${{ env.WASM_GMP_VERSION }}-mpfr-${{ env.WASM_MPFR_VERSION }}-emscripten-latest
      - name: Cache CMake dependencies
        uses: actions/cache@v4
        with:
          path: build-wasm/_deps
          key: cmake-deps-catch2-${{ env.CATCH2_VERSION }}-emscripten
      - name: Install Emscripten
        if: steps.emsdk-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git /opt/emsdk
          /opt/emsdk/emsdk install latest
          /opt/emsdk/emsdk activate latest
      - name: Build WebAssembly
        run: |
          source /opt/emsdk/emsdk_env.sh
          ./scripts/build-wasm.sh
